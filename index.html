<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة برو ماكس</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>حاسبة برو ماكس</h1>
            <button id="theme-toggle">🌙</button>
        </div>
        
        <div class="calculator">
            <input type="text" id="display" disabled>
            
            <div class="history" id="history"></div>
            
            <div class="buttons">
                <button class="btn scientific" onclick="addToDisplay('sin(')">sin</button>
                <button class="btn scientific" onclick="addToDisplay('cos(')">cos</button>
                <button class="btn scientific" onclick="addToDisplay('tan(')">tan</button>
                <button class="btn scientific" onclick="addToDisplay('π')">π</button>
                
                <button class="btn scientific" onclick="addToDisplay('√(')">√</button>
                <button class="btn scientific" onclick="addToDisplay('^')">x²</button>
                <button class="btn" onclick="addToDisplay('(')">(</button>
                <button class="btn" onclick="addToDisplay(')')">)</button>

                <button class="btn clear" onclick="clearDisplay()">AC</button>
                <button class="btn" onclick="deleteLast()">DEL</button>
                <button class="btn" onclick="addToDisplay('%')">%</button>
                <button class="btn operator" onclick="addToDisplay('/')">÷</button>

                <button class="btn" onclick="addToDisplay('7')">7</button>
                <button class="btn" onclick="addToDisplay('8')">8</button>
                <button class="btn" onclick="addToDisplay('9')">9</button>
                <button class="btn operator" onclick="addToDisplay('*')">×</button>

                <button class="btn" onclick="addToDisplay('4')">4</button>
                <button class="btn" onclick="addToDisplay('5')">5</button>
                <button class="btn" onclick="addToDisplay('6')">6</button>
                <button class="btn operator" onclick="addToDisplay('-')">-</button>

                <button class="btn" onclick="addToDisplay('1')">1</button>
                <button class="btn" onclick="addToDisplay('2')">2</button>
                <button class="btn" onclick="addToDisplay('3')">3</button>
                <button class="btn operator" onclick="addToDisplay('+')">+</button>

                <button class="btn" onclick="clearHistory()">CH</button>
                <button class="btn" onclick="addToDisplay('0')">0</button>
                <button class="btn" onclick="addToDisplay('.')">.</button>
                <button class="btn equals" onclick="calculate()">=</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
