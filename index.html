<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <h2>المحسبة الكاملة</h2>
        
        <input id="r1" type="number" placeholder="الرقم الأول">
        <input id="r2" type="number" placeholder="الرقم الثاني">
        
        <br>
        <button class="amaliyat" onclick="hisab('+')">+</button>
        <button class="amaliyat" onclick="hisab('-')">-</button>
        <button class="amaliyat" onclick="hisab('*')">×</button>
        <button class="amaliyat" onclick="hisab('/')">÷</button>
        
        <br>
        <button class="mseh" onclick="mseh()">مسح C</button>
        
        <h3 id="natija">النتيجة = 0</h3>
    </div>

    <script>
        function hisab(type) {
            let n1 = Number(document.getElementById("r1").value);
            let n2 = Number(document.getElementById("r2").value);
            let res = 0;
            
            if (type === '+') res = n1 + n2;
            if (type === '-') res = n1 - n2;
            if (type === '*') res = n1 * n2;
            if (type === '/') {
                if (n2 === 0) {
                    res = "مايمكنش نقسمو على 0";
                } else {
                    res = n1 / n2;
                }
            }
            
            document.getElementById("natija").innerText = "النتيجة = " + res;
        }
        
        function mseh() {
            document.getElementById("r1").value = "";
            document.getElementById("r2").value = "";
            document.getElementById("natija").innerText = "النتيجة = 0";
        }
    </script>
</body>
</html>
